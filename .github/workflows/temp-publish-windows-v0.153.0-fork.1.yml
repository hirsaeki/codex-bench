name: Temporary publish Windows v0.153.0 fork.1

on:
  push:
    branches:
      - ops/publish-windows-v0.153.0-fork.1

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch verified prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run publish-windows-release.yml \
            --ref main \
            -f build_run_id=33814204591 \
            -f release_tag=windows-v0.153.0-fork.1 \
            -f 'release_name=Codex Windows v0.153.0 fork.1' \
            -f prerelease=true
