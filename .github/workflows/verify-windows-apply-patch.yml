name: Verify Windows apply_patch artifact

on:
  workflow_run:
    workflows:
      - Build Windows apply_patch artifact
    types:
      - completed
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Windows apply_patch artifact run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      BUILD_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}

    steps:
      - name: Download reusable binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-apply-patch-bin
          path: ${{ runner.temp }}/windows-apply-patch-bin
          repository: hirsaeki/codex-bench
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate artifact provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = Join-Path $env:RUNNER_TEMP 'windows-apply-patch-bin'
          $provenancePath = Join-Path $binDir 'provenance.json'
          if (-not (Test-Path $provenancePath)) {
            throw 'artifact provenance.json is missing'
          }

          $provenance = Get-Content $provenancePath -Raw | ConvertFrom-Json
          if ($provenance.source_repository -ne 'hirsaeki/codex') {
            throw "unexpected source repository: $($provenance.source_repository)"
          }
          if ([string]$provenance.build_run_id -ne $env:BUILD_RUN_ID) {
            throw "artifact build run $($provenance.build_run_id) did not match requested run $env:BUILD_RUN_ID"
          }

          foreach ($entry in $provenance.binaries.PSObject.Properties) {
            $path = Join-Path $binDir $entry.Name
            if (-not (Test-Path $path)) {
              throw "missing reusable verification binary: $($entry.Name)"
            }
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne [string]$entry.Value) {
              throw "SHA-256 mismatch for $($entry.Name): expected $($entry.Value), got $actual"
            }
          }

          "SOURCE_SHA=$($provenance.source_sha)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRIGGER_ISSUE_NUMBER=$([string]$provenance.trigger_issue_number)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using build run $env:BUILD_RUN_ID for source $($provenance.source_sha)"

      - name: Prepare measurement environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = Join-Path $env:RUNNER_TEMP 'windows-apply-patch-bin'
          $codexHome = Join-Path $env:RUNNER_TEMP 'codex-windows-apply-patch-home'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $codexHome
          New-Item -ItemType Directory -Force -Path $codexHome | Out-Null
          "CODEX_HOME=$codexHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Execute compiled P0/P1R harness
        id: harness
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = Join-Path $env:RUNNER_TEMP 'windows-apply-patch-bin'
          $resultDir = Join-Path $env:RUNNER_TEMP 'windows-apply-patch-result'
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $rawLog = Join-Path $resultDir 'harness.log'
          $testExe = Join-Path $binDir 'windows_apply_patch_baseline.exe'

          & $testExe --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $rawLog
          $testExit = $LASTEXITCODE

          $sandboxLogDir = Join-Path $env:CODEX_HOME '.sandbox'
          if (Test-Path $sandboxLogDir) {
            Get-ChildItem -Path $sandboxLogDir -Filter 'sandbox.*.log' -ErrorAction SilentlyContinue |
              Copy-Item -Destination $resultDir -Force
          }

          $parsed = @()
          foreach ($line in Get-Content $rawLog) {
            if ($line -match 'APPLY_PATCH_BASELINE_RESULT (?<json>\{.*\})') {
              $parsed += ($Matches.json | ConvertFrom-Json)
            }
          }
          @($parsed) | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $resultDir 'results.json')

          Copy-Item (Join-Path $binDir 'provenance.json') (Join-Path $resultDir 'build-provenance.json')
          $verifyMetadata = [ordered]@{
            schema_version = 1
            build_run_id = $env:BUILD_RUN_ID
            source_sha = $env:SOURCE_SHA
            verify_run_id = $env:GITHUB_RUN_ID
            verify_run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            windows_sandbox_level = 'elevated'
            harness_exit_code = $testExit
          }
          $verifyMetadata | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $resultDir 'verify-metadata.json')

          if ($testExit -ne 0) {
            Write-Host '--- harness failure tail ---'
            Get-Content $rawLog -Tail 100
            exit $testExit
          }

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-apply-patch-result-${{ env.BUILD_RUN_ID }}-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-apply-patch-result
          if-no-files-found: warn
          retention-days: 14

      - name: Require harness success
        if: always() && steps.harness.outcome != 'success'
        shell: pwsh
        run: throw 'compiled Windows apply_patch harness failed; inspect the uploaded result artifact'

      - name: Close trigger issue
        uses: actions/github-script@v8
        with:
          script: |
            const issueNumber = Number(process.env.TRIGGER_ISSUE_NUMBER || 0);
            if (!issueNumber) return;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed',
            });
