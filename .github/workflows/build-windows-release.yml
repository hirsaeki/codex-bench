name: Build Windows release artifact

on:
  workflow_dispatch:
    inputs:
      revision:
        description: hirsaeki/codex branch, tag, or commit SHA
        required: true
        default: main
        type: string
      trigger_issue_number:
        description: Optional codex-bench issue number to close after successful verification
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Check out Codex source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: hirsaeki/codex
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Set up Codex CI environment
        uses: ./.github/actions/setup-ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ env.TARGET }}

      - name: Configure LLVM linker
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ env.TARGET }}

      - name: Resolve source revision and version
        id: source
        shell: pwsh
        env:
          SOURCE_REVISION_INPUT: ${{ inputs.revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'codex-cli' } | Select-Object -First 1
          if (-not $package) {
            throw 'codex-cli package was not found in cargo metadata'
          }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$($package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved $env:SOURCE_REVISION_INPUT to $sha (Codex $($package.version))"

      - name: Build Windows release binaries once
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LIBSQLITE3_FLAGS = 'SQLITE_DISABLE_INTRINSIC'
          cargo build --target $env:TARGET --release `
            --bin codex `
            --bin codex-code-mode-host `
            --bin codex-windows-sandbox-setup `
            --bin codex-command-runner

      - name: Build canonical Windows package
        shell: pwsh
        env:
          SOURCE_REVISION_INPUT: ${{ inputs.revision }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          CODEX_VERSION: ${{ steps.source.outputs.version }}
          TRIGGER_ISSUE_NUMBER: ${{ inputs.trigger_issue_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $releaseDir = Join-Path (Join-Path $metadata.target_directory $env:TARGET) 'release'
          $dist = Join-Path $env:RUNNER_TEMP 'windows-release'
          $packageDir = Join-Path $env:RUNNER_TEMP 'codex-package'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $zipName = "codex-package-$($env:TARGET).zip"
          $zipPath = Join-Path $dist $zipName
          $builder = Join-Path $env:GITHUB_WORKSPACE 'scripts/build_codex_package.py'

          & python $builder `
            --target $env:TARGET `
            --variant codex `
            --package-version $env:CODEX_VERSION `
            --package-dir $packageDir `
            --archive-output $zipPath `
            --cargo-profile release `
            --entrypoint-bin (Join-Path $releaseDir 'codex.exe') `
            --code-mode-host-bin (Join-Path $releaseDir 'codex-code-mode-host.exe') `
            --codex-command-runner-bin (Join-Path $releaseDir 'codex-command-runner.exe') `
            --codex-windows-sandbox-setup-bin (Join-Path $releaseDir 'codex-windows-sandbox-setup.exe') `
            --force
          if ($LASTEXITCODE -ne 0) {
            throw "canonical package builder failed with exit code $LASTEXITCODE"
          }

          $packageHash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          $binaryHashes = [ordered]@{}
          foreach ($file in @(
            'codex.exe',
            'codex-code-mode-host.exe',
            'codex-command-runner.exe',
            'codex-windows-sandbox-setup.exe'
          )) {
            $binaryHashes[$file] = (Get-FileHash -Algorithm SHA256 (Join-Path $releaseDir $file)).Hash.ToLowerInvariant()
          }

          $provenance = [ordered]@{
            schema_version = 1
            source_repository = 'hirsaeki/codex'
            source_revision_input = $env:SOURCE_REVISION_INPUT
            source_sha = $env:SOURCE_SHA
            trigger_issue_number = $env:TRIGGER_ISSUE_NUMBER
            codex_version = $env:CODEX_VERSION
            target = $env:TARGET
            cargo_profile = 'release'
            signed = $false
            build_run_id = $env:GITHUB_RUN_ID
            build_run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            package = [ordered]@{
              file = $zipName
              sha256 = $packageHash
            }
            binaries = $binaryHashes
          }
          $provenancePath = Join-Path $dist 'release-provenance.json'
          $provenance | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $provenancePath
          $provenanceHash = (Get-FileHash -Algorithm SHA256 $provenancePath).Hash.ToLowerInvariant()

          @(
            "$packageHash  $zipName"
            "$provenanceHash  release-provenance.json"
          ) | Set-Content -Encoding ascii (Join-Path $dist 'SHA256SUMS')

          Get-Content $provenancePath
          Get-Content (Join-Path $dist 'SHA256SUMS')

      - name: Upload reusable Windows release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-package
          path: ${{ runner.temp }}/windows-release
          if-no-files-found: error
          retention-days: 14
