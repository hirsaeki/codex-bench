name: Build Windows apply_patch artifact

on:
  workflow_dispatch:
    inputs:
      revision:
        description: hirsaeki/codex branch, tag, or commit SHA
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - name: Check out Codex source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: hirsaeki/codex
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Set up Codex CI environment
        uses: ./.github/actions/setup-ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Resolve source revision
        id: source
        shell: pwsh
        env:
          SOURCE_REVISION_INPUT: ${{ inputs.revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved $env:SOURCE_REVISION_INPUT to $sha"

      - name: Build Windows sandbox helpers
        shell: pwsh
        run: cargo build -p codex-windows-sandbox --bin codex-windows-sandbox-setup --bin codex-command-runner

      - name: Build apply_patch harness without running it
        shell: pwsh
        run: cargo test -p codex-core --test windows_apply_patch_baseline --no-run

      - name: Stage reusable artifact
        shell: pwsh
        env:
          SOURCE_REVISION_INPUT: ${{ inputs.revision }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $debugDir = Join-Path $metadata.target_directory 'debug'
          $depsDir = Join-Path $debugDir 'deps'
          $testExe = Get-ChildItem -Path $depsDir -Filter 'windows_apply_patch_baseline-*.exe' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $testExe) {
            throw 'windows_apply_patch_baseline test executable was not found'
          }

          $out = Join-Path $env:RUNNER_TEMP 'windows-apply-patch-bin'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item $testExe.FullName (Join-Path $out 'windows_apply_patch_baseline.exe')
          Copy-Item (Join-Path $debugDir 'codex-windows-sandbox-setup.exe') $out
          Copy-Item (Join-Path $debugDir 'codex-command-runner.exe') $out

          $hashes = [ordered]@{}
          foreach ($file in @(
            'windows_apply_patch_baseline.exe',
            'codex-windows-sandbox-setup.exe',
            'codex-command-runner.exe'
          )) {
            $hashes[$file] = (Get-FileHash -Algorithm SHA256 (Join-Path $out $file)).Hash.ToLowerInvariant()
          }

          $provenance = [ordered]@{
            schema_version = 1
            source_repository = 'hirsaeki/codex'
            source_revision_input = $env:SOURCE_REVISION_INPUT
            source_sha = $env:SOURCE_SHA
            build_run_id = $env:GITHUB_RUN_ID
            build_run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            binaries = $hashes
          }
          $provenance | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $out 'provenance.json')
          Get-Content (Join-Path $out 'provenance.json')

      - name: Upload reusable binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-apply-patch-bin
          path: ${{ runner.temp }}/windows-apply-patch-bin
          if-no-files-found: error
          retention-days: 14
